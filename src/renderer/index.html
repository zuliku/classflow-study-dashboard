<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClassFlow - 大学生课表与作业 DDL 学习管理系统</title>
    <script>
      (() => {
        let preference = "system";
        let uiFont = "harmonyos-sans-sc";
        try {
          const raw = window.localStorage.getItem("classflow-storage-v2");
          if (raw) {
            try {
              const parsed = JSON.parse(raw);
              const persisted = (parsed && parsed.state && parsed.state.preferences)
                || (parsed && parsed.preferences);
              if (persisted && ["system", "full", "reduced"].includes(persisted.motionPreference)) {
                preference = persisted.motionPreference;
              }
              if (persisted && ["harmonyos-sans-sc", "source-han-sans-sc", "misan"].includes(persisted.uiFont)) {
                uiFont = persisted.uiFont;
              }
            } catch {}
          }
        } catch {}
        try {
          const systemReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          const reduced = preference === "reduced" || (preference === "system" && systemReduced);
          const root = document.documentElement;
          root.dataset.motionPreference = preference;
          root.dataset.motionEffective = reduced ? "reduced" : "full";
          root.dataset.uiFont = uiFont;
          // Motion V5 灰度：仅本地 dev（localhost / 127.0.0.1），
          // URL 显式 v4/v5 优先，否则读 Gallery 持久化值。生产 file:// 不命中。
          const isLocalDev = /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname);
          if (isLocalDev) {
            const params = new URLSearchParams(window.location.search);
            const urlEasing = params.get("motion-easing");
            let storedEasing = null;
            try {
              storedEasing = window.localStorage.getItem("classflow-motion-easing");
            } catch {}
            const easing = urlEasing === "v5" || urlEasing === "v4" ? urlEasing : storedEasing;
            if (easing === "v5") root.dataset.motionEasing = "v5";
          }
        } catch {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-[#F7F5F5] text-charcoal antialiased">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
