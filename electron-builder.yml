appId: com.classflow.desktop
productName: ClassFlow
copyright: Copyright © 2026 ClassFlow

directories:
  output: dist
  buildResources: build

afterPack: scripts/afterPack.cjs

files:
  - out/**/*
  - package.json

asarUnpack:
  - node_modules/pdfjs-dist/standard_fonts/**/*
  - node_modules/@napi-rs/canvas/**/*
  # node-pty：原生模块 + winpty/conpty 运行时（Electron ABI .node / dll / exe 需解包）
  - node_modules/node-pty/**/*

npmRebuild: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ClassFlow-Setup-${version}.${ext}
  # 发布说明：当前为未签名预览版（signAndEditExecutable: false），安装时 Windows SmartScreen
  # 会提示“未知发布者”。正式分发需配置代码签名（CSC_LINK / CSC_KEY_PASSWORD 或 AzureSignTool），
  # 并移除此开关。afterPack 仍通过 rcedit 写入图标与版本信息（若 winCodeSign 可用）。
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ClassFlow
  uninstallDisplayName: ClassFlow
  # 统一使用设计交付的 classflow.ico（BMP 小尺寸 + 256 PNG，NSIS 3.0.4 兼容）
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
