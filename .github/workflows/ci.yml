name: ClassFlow CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm 10.9.8
        run: npm install -g npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Security secrets
        run: npm run security:secrets

      - name: TypeCheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
