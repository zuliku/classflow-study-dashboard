<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">QQ Mail icon</title>
  <desc id="desc">Vector reconstruction of the current QQ Mail app icon, based on Tencent's official Google Play artwork.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5db00"/>
      <stop offset="0.50" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#f9661d"/>
    </linearGradient>
    <radialGradient id="green" cx="0.78" cy="0.03" r="0.72">
      <stop offset="0" stop-color="#b8ed00" stop-opacity="0.95"/>
      <stop offset="0.52" stop-color="#cde600" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cde600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellow" cx="0.02" cy="0.02" r="0.60">
      <stop offset="0" stop-color="#ffd000" stop-opacity="0.82"/>
      <stop offset="0.62" stop-color="#ffd000" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffd000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="104" ry="104"/>
    </clipPath>
  </defs>
  <g clip-path="url(#iconClip)">
    <rect width="512" height="512" fill="url(#base)"/>
    <rect width="512" height="512" fill="url(#green)"/>
    <rect width="512" height="512" fill="url(#yellow)"/>
  </g>
  <rect x="105" y="143" width="302" height="217" rx="18" ry="18"
        fill="none" stroke="#fff" stroke-width="30" stroke-linejoin="round"/>
  <path d="M120 158 L256 265 L392 158"
        fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
